<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMA Marketing — ACA Live Call Script</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
 
 <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f2d4a;
      --navy-light: #1a3f63;
      --accent: #2196f3;
      --accent-hover: #1976d2;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --green-light: #f0fdf4;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --amber-light: #fffbeb;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --red-light: #fef2f2;
      --sidebar-w: 260px;
      --bg: #ffffff;
      --bg2: #f8fafc;
      --bg3: #f1f5f9;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --text: #1e293b;
      --text-secondary: #64748b;
      --muted: #94a3b8;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --bg2: #1e293b;
        --bg3: #334155;
        --border: #334155;
        --border-light: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #cbd5e1;
        --muted: #64748b;
        --green-bg: #164e63;
        --amber-bg: #78350f;
        --red-bg: #7f1d1d;
        --green-light: #0f3f3f;
        --amber-light: #5c3d2e;
        --red-light: #5c2e2e;
      }
      .plan-card { background: #1e3a5f !important; }
      .plan-item { background: #0f2d4a !important; border-color: #1a3f63 !important; }
      .plan-item input { color: #e0ecf8 !important; }
      .plan-card h3 { color: #e0ecf8 !important; }
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; background: var(--bg2); color: var(--text); font-size: 14px; line-height: 1.5; }

    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--bg2);
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(135deg, var(--navy) 0%, #1a3f63 100%);
      color: #e0ecf8;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow-md);
    }
    .sidebar-header {
      padding: 24px 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.1);
    }
    .sidebar-header h1 { 
      font-size: 16px; 
      font-weight: 700; 
      color: #fff; 
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .sidebar-header p  { 
      font-size: 12px; 
      color: #a8c5e0; 
      margin-top: 2px; 
    }

    .new-call-btn {
      margin: 12px;
      background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: calc(100% - 24px);
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(33, 150, 243, 0.25);
    }
    .new-call-btn:hover { 
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.35);
      transform: translateY(-1px);
    }

    .sidebar-section {
      padding: 12px 16px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #5b8aad;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .step-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      margin: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      color: #a8c5e0;
      border-left: 3px solid transparent;
      border-radius: 8px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .step-btn:hover  { 
      background: rgba(255,255,255,0.08); 
      color: #fff; 
      padding-left: 12px;
    }
    .step-btn.active { 
      background: rgba(33,150,243,0.25); 
      color: #fff; 
      border-left-color: #2196f3;
      font-weight: 600;
    }
    .step-btn.done   { 
      color: #7ba3c0; 
    }

    .step-btn .num {
      width: 20px; 
      height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      font-size: 10px;
      display: flex; 
      align-items: center; 
      justify-content: center;
      flex-shrink: 0;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .step-btn.active .num { 
      background: #2196f3; 
      color: #fff;
      box-shadow: 0 0 8px rgba(33, 150, 243, 0.4);
    }
    .step-btn.done .num { 
      background: #16a34a; 
      color: #fff; 
    }

    .ref-btn {
      display: flex; 
      align-items: center; 
      gap: 8px;
      padding: 8px 14px;
      margin: 2px 8px;
      cursor: pointer;
      font-size: 12px;
      color: #a8c5e0;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .ref-btn:hover { 
      color: #fff; 
      background: rgba(255,255,255,0.08); 
      padding-left: 16px;
    }

    /* ── MAIN ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    #topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      background: var(--bg);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .topbar-left { 
      display: flex; 
      align-items: center; 
      gap: 14px;
    }

    .live-badge {
      background: linear-gradient(135deg, #078546 0%, #079b13 100%);
      color: #fff;
      font-size: 11px; 
      font-weight: 700;
      padding: 5px 10px; 
      border-radius: 6px; 
      letter-spacing: 0.5px;
      animation: pulse 2s infinite;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }

    .step-label { 
      font-size: 15px; 
      font-weight: 600; 
      color: var(--text);
    }
    .step-sub   { 
      font-size: 12px; 
      color: var(--muted);
      margin-top: 2px;
    }

    .nav-btns { 
      display: flex; 
      gap: 10px; 
    }
    .nav-btn {
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover { 
      background: var(--bg3);
      border-color: var(--muted);
    }
    .nav-btn.primary { 
      background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%);
      color: #fff; 
      border-color: #2196f3;
      box-shadow: 0 2px 8px rgba(33, 150, 243, 0.25);
    }
    .nav-btn.primary:hover { 
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
      box-shadow: 0 4px 12px rgba(33, 150, 243, 0.35);
      transform: translateY(-1px);
    }

    .progress-bar { 
      height: 3px; 
      background: var(--border); 
      flex-shrink: 0;
    }
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #2196f3 0%, #1976d2 100%);
      transition: width 0.3s ease; 
    }

    #content { 
      flex: 1; 
      overflow-y: auto; 
      padding: 32px 40px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    /* ── CONTENT COMPONENTS ── */
    .step-title { 
      font-size: 24px; 
      font-weight: 700; 
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .step-desc  { 
      font-size: 14px; 
      color: var(--text-secondary);
      margin-bottom: 24px; 
      line-height: 1.6;
    }

    .script-block {
      background: linear-gradient(135deg, #f0f7ff 0%, #f5f9ff 100%);
      border: 1px solid #e0ebf7;
      color: var(--text);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid #2196f3;
    }
    .script-block p {
      margin-bottom: 12px;
      line-height: 1.7;
      font-size: 13px;
    }
    .script-block ul {
      margin: 12px 0 12px 20px;
    }
    .script-block li {
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .script-block strong {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      color: var(--navy);
      font-weight: 700;
    }
    .script-block .lbl {
      font-size: 11px; 
      font-weight: 700;
      color: #1565c0; 
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .script-block p { 
      font-size: 13px; 
      line-height: 1.65; 
      color: var(--text-secondary);
    }
    .script-block p + p { margin-top: 8px; }
    .script-block .hl { 
      color: #2196f3; 
      font-weight: 600; 
      background: rgba(33, 150, 243, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tip-block {
      background: linear-gradient(135deg, #fffbeb 0%, #fef8e7 100%);
      border-left: 4px solid var(--amber);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.6;
      box-shadow: var(--shadow-sm);
    }
    .tip-block strong { 
      display: block; 
      margin-bottom: 4px; 
      font-size: 12px; 
      letter-spacing: 0.3px;
      color: #b45309;
    }

    .ok-block {
      background: linear-gradient(135deg, #f0fdf4 0%, #e8fce8 100%);
      border-left: 4px solid var(--green);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #14532d;
      line-height: 1.6;
      box-shadow: var(--shadow-sm);
    }

    .checklist {
      list-style: none;
      margin-bottom: 18px;
      background: var(--bg2);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
      color: var(--text);
    }
    .checklist li:last-child { border-bottom: none; }

    .check-box {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 4px;
      cursor: pointer;
      font-size: 12px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      background: var(--bg);
    }
    .check-box:hover {
      border-color: #2196f3;
      background: rgba(33, 150, 243, 0.05);
    }
    .check-box.checked {
      background: #16a34a;
      border-color: #16a34a;
      color: white;
      box-shadow: 0 0 8px rgba(22, 163, 74, 0.3);
    }

    .warn-block {
      background: linear-gradient(135deg, #fef2f2 0%, #fee8e8 100%);
      border-left: 4px solid var(--red);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #7f1d1d;
      line-height: 1.6;
      box-shadow: var(--shadow-sm);
    }

    .section-divider {
      font-size: 11px; 
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 28px 0 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }

    /* Form fields */
    .info-card { 
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md); 
      padding: 14px; 
      box-shadow: var(--shadow-sm);
    }
    .info-card .ic-label { 
      font-size: 12px; 
      color: var(--text-secondary);
      margin-bottom: 6px; 
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .info-card input,
    .info-card select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .info-card input:focus,
    .info-card select:focus { 
      border-color: #2196f3;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    /* SEP list */
    .sep-list { 
      list-style: none; 
      margin-bottom: 16px;
    }
    .sep-list li {
      padding: 10px 12px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px; 
      color: var(--text);
      cursor: pointer; 
      transition: all 0.15s ease;
      background: var(--bg2);
    }
    .sep-list li:hover    { 
      background: var(--bg3);
      border-color: #2196f3;
      padding-left: 14px;
    }
    .sep-list li.selected { 
      background: #dbeafe; 
      border-color: #2196f3; 
      color: #1e3a5f;
      font-weight: 600;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    /* Consent items */
    .consent-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      background: var(--bg2);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .consent-item:hover {
      border-color: #2196f3;
      box-shadow: var(--shadow-md);
    }
    .consent-item .c-num { 
      font-size: 11px; 
      font-weight: 700; 
      color: #2196f3;
      margin-bottom: 8px; 
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .consent-item p { 
      font-size: 13px; 
      color: var(--text-secondary);
      line-height: 1.7; 
      margin-bottom: 12px; 
    }
    .yes-btn {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: #fff;
      border: none; 
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 12px; 
      font-weight: 600;
      cursor: pointer; 
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.25);
    }
    .yes-btn:hover { 
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
      transform: translateY(-1px);
    }
    .yes-btn.got { 
      background: linear-gradient(135deg, #dcfce7 0%, #c6f6d5 100%);
      color: #14532d; 
      cursor: default;
      box-shadow: var(--shadow-sm);
    }

    /* Complete */
    .complete-card { 
      text-align: center; 
      padding: 60px 40px;
      background: linear-gradient(135deg, #f0f7ff 0%, #e8f4ff 100%);
      border-radius: var(--radius-lg);
      border: 1px solid #dbeafe;
    }
    .complete-card .big-check {
      width: 80px; 
      height: 80px;
      background: linear-gradient(135deg, #dcfce7 0%, #c6f6d5 100%);
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
      box-shadow: 0 8px 24px rgba(22, 163, 74, 0.2);
    }
    .complete-card h2 { 
      font-size: 28px; 
      font-weight: 700; 
      color: var(--text); 
      margin-bottom: 8px;
    }
    .complete-card p  { 
      font-size: 14px; 
      color: var(--text-secondary);
      max-width: 420px; 
      margin: 0 auto 28px; 
      line-height: 1.7;
    }

    .logo-container {
      padding: 12px;
      text-align: center;
    }
    .logo {
      max-width: 100%;
      height: auto;
      max-height: 90px;
    }

    .rebuttal-item {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .rebuttal-item:hover {
      box-shadow: var(--shadow-md);
      border-color: #2196f3;
    }
    .rebuttal-header {
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      transition: all 0.15s ease;
      color: var(--text);
    }
    .rebuttal-header:hover {
      background: var(--bg3);
    }
    .rebuttal-body {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
      display: none;
    }
    .rebuttal-body.show {
      display: block;
    }
    .rebuttal-toggle {
      font-size: 12px;
      color: var(--muted);
      transition: transform 0.2s ease;
      display: inline-block;
    }
    .rebuttal-item.active .rebuttal-toggle {
      transform: rotate(180deg);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg2);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

 </style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
     <div class="logo-container">
<img src="./logo.png" class="logo">
</div>
      <h1>EMA Marketing</h1>
      <p>ACA Enrollment Script</p>
    </div>
    <button class="new-call-btn" onclick="newCall()">↺ New Call</button>
    <div class="sidebar-section">Call Steps</div>
    <div id="step-list"></div>
    <div class="sidebar-section" style="margin-top:12px;">Reference</div>
    <div class="ref-btn" onclick="goRef('sep')">⚡ SEP Events</div>
    <div class="ref-btn" onclick="goRef('consent')">📋 Rebuttals</div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <span class="live-badge">● LIVE</span>
        <div>
          <div class="step-label" id="top-label">Opening</div>
          <div class="step-sub"  id="top-sub">Step 1 of 10</div>
        </div>
      </div>
     <div class="nav-btns">
        <button class="nav-btn" onclick="prevStep()">← Back</button>
        <button class="nav-btn primary" onclick="nextStep()">Next →</button>
      </div> 
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
    <div id="content"></div>
  </div>
</div>

<script>
  /* ── STATE ── */
  const STEPS = [
    { id:0, label:'Opening',     title:'Opening Script',                desc:'Greet the caller, verify Medicare/Medicaid status, and confirm they are calling about a health subsidy.' },
    { id:1, label:'SEP Check',   title:'SEP Qualification',             desc:'Confirm a qualifying life event within the last 60 days to enroll outside Open Enrollment.' },
    { id:2, label:'Client Info', title:'Qualifying Information',         desc:'Gather zip code, DOB, estimated income, dependents, doctors, and medications.' },
    { id:3, label:'Plan Match',  title:'Health Subsidy & Plan',          desc:'Communicate their subsidy amount and recommend the best-fit plan.' },
    { id:4, label:'Benefits',    title:'Explanation of Benefits',        desc:'Walk through all copays, deductibles, and plan incentives.' },
    { id:5, label:'Verification',title:'Verification & Application',     desc:'Confirm all client details for the Marketplace application.' },
    { id:6, label:'Consent',     title:'Verbal Consent',                 desc:'Obtain verbal YES on all 6 consent points before submitting enrollment.' },
    { id:7, label:'E-Sign',      title:'E-Signature',                    desc:'Send e-sign documents to customer for their signature.' },
    { id:8, label:'Final Notes', title:'Final Notes & Disclosure',       desc:'Share post-enrollment disclosures, agent compensation notice, and next steps.' },
    { id:9, label:'Complete',    title:'Enrollment Complete',            desc:'Congratulate the client and confirm next steps.' },
  ];

  let currentStep    = 0;
  let completedSteps = new Set();
  let checkedItems   = {};
  let consentGiven   = {};
  let inRef          = null;

  /* ── NAVIGATION ── */
  function goStep(id) {
    if (currentStep >= 0 && currentStep < STEPS.length) completedSteps.add(currentStep);
    currentStep = id;
    inRef = null;
    renderSidebar();
    updateTopbar();
    renderContent();
    // Scroll to top of content area
    const contentDiv = document.getElementById('content');
    if (contentDiv) {
      contentDiv.scrollTop = 0;
    }
  }
  function nextStep() { if (currentStep < STEPS.length - 1) goStep(currentStep + 1); }
  function prevStep() {
    if (inRef) { inRef = null; renderContent(); const contentDiv = document.getElementById('content'); if (contentDiv) contentDiv.scrollTop = 0; return; }
    if (currentStep > 0) { completedSteps.delete(currentStep); currentStep--; renderSidebar(); updateTopbar(); renderContent(); const contentDiv = document.getElementById('content'); if (contentDiv) contentDiv.scrollTop = 0; }
  }
  function newCall() {
    currentStep = 0; completedSteps.clear();
    checkedItems = {}; consentGiven = {}; inRef = null;
    renderSidebar(); updateTopbar(); renderContent();
    const contentDiv = document.getElementById('content');
    if (contentDiv) {
      contentDiv.scrollTop = 0;
    }
  }
  function goRef(name) { inRef = name; renderContent(); const contentDiv = document.getElementById('content'); if (contentDiv) contentDiv.scrollTop = 0; }

  /* ── UI HELPERS ── */
  function check(id) {
    checkedItems[id] = !checkedItems[id];
    const box = document.querySelector(`[data-check="${id}"]`);
    if (box) { box.classList.toggle('checked', checkedItems[id]); box.textContent = checkedItems[id] ? '✓' : ''; }
  }
  function giveConsent(n) {
    consentGiven[n] = true;
    const btn = document.querySelector(`[data-consent="${n}"]`);
    if (btn) { btn.textContent = '✓ YES — Confirmed'; btn.classList.add('got'); }
  }
  function selectSep(el) {
    document.querySelectorAll('.sep-list li').forEach(li => li.classList.remove('selected'));
    el.classList.add('selected');
  }
  function toggleElite(id) {
    const item = document.querySelector(`[data-rebuttal-id="${id}"]`);
    if (item) {
      item.classList.toggle('active');
      const body = item.querySelector(`[data-rebuttal="${id}"]`);
      if (body) body.classList.toggle('show');
    }
  }

  function renderSidebar() {
    document.getElementById('step-list').innerHTML = STEPS.map(s => {
      const isDone   = completedSteps.has(s.id) && s.id !== currentStep;
      const isActive = s.id === currentStep;
      return `
        <div class="step-btn ${isActive?'active':''} ${isDone?'done':''}" onclick="goStep(${s.id})">
          <div class="num">${isDone ? '✓' : s.id + 1}</div>
          <span>${s.label}</span>
        </div>`;
    }).join('');
  }

  function updateTopbar() {
    const s = STEPS[currentStep] || {};
    document.getElementById('top-label').textContent = inRef ? 'Quick Reference' : s.title || '';
    document.getElementById('top-sub').textContent   = `Step ${currentStep + 1} of ${STEPS.length}`;
    document.getElementById('prog').style.width      = `${((currentStep + 1) / STEPS.length) * 100}%`;
  }

  /* ── RENDER CONTENT ── */
  function renderContent() {
    if (inRef === 'sep')     { renderSepRef();     return; }
    if (inRef === 'consent') { renderConsentRef(); return; }
    const renders = [r0, r1, r2, r3, r4, r5, r6, r7, r8, r9];
    document.getElementById('content').innerHTML = renders[currentStep] ? renders[currentStep]() : '';
  }

  /* ── STEP RENDERERS ── */
  function chk(id, label) {
    return `<li><div class="check-box ${checkedItems[id]?'checked':''}" data-check="${id}" onclick="check('${id}')">${checkedItems[id]?'✓':''}</div>${label}</li>`;
